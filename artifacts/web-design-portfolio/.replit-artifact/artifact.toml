kind = "web"
previewPath = "/"
title = "Freelance Web Design Portfolio"
description = "A polished, responsive portfolio for a freelance web designer offering modern remote website design for small businesses, with services, starting-price packages, a featured project, and contact links."
version = "1.0.0"
id = "artifacts/web-design-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20755

[services.development]
run = "pnpm --filter @workspace/web-design-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/web-design-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/web-design-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20755"
BASE_PATH = "/"
